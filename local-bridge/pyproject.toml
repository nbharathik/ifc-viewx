[project]
name = "ifcviewx"
version = "0.2.0"
description = "IFCViewX Local Studio: fast, private IFC viewer with IfcOpenShell conversion, native Python, model checks and an MCP bridge"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bharathi Kannan" }]
keywords = ["ifc", "bim", "viewer", "ifcopenshell", "mcp", "openbim"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    # One install gives the whole product. The marker keeps a Python with no
    # IfcOpenShell wheel installable: the service then drops conversion and
    # native Python from its capabilities instead of failing to install.
    "ifcopenshell>=0.8.1; python_version < '3.14'",
]

[project.optional-dependencies]
# Kept as a no-op so older instructions still resolve; conversion ships by default.
convert = []
# `ifcviewx check --ids` runs the buildingSMART reference IDS implementation.
# Optional because structural checks need nothing extra, and CI images that
# never pass --ids should not carry it.
check = ["ifctester>=0.8.1"]

[project.scripts]
ifcviewx = "ifcviewx.cli:main"
ifcx-convert = "ifcviewx.convert:main"

[project.urls]
Homepage = "https://github.com/nbharathik/ifc-viewx"
Viewer = "https://nbharathik.github.io/ifc-viewx/"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifcviewx"]

[tool.hatch.build.targets.sdist]
only-include = ["src/ifcviewx", "hatch_build.py", "README.md", "pyproject.toml", "LICENSE"]

# The built viewer is copied into src/ifcviewx/app by hatch_build.py; it is
# gitignored, so it must be declared an artifact to ship.
[tool.hatch.build]
artifacts = ["src/ifcviewx/app"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
