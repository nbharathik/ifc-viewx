name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: npm run contracts:types:check
      - run: npm run metrics -- --output project-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: project-metrics
          path: project-metrics.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-dist
          path: dist/
          retention-days: 2

  package:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: local-bridge/pyproject.toml
      - run: pip install "build>=1.3,<2" "twine>=7,<8"
      - run: python -m build local-bridge
      - run: twine check local-bridge/dist/*
      - name: Verify the wheel contains the viewer
        run: python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('local-bridge/dist/*.whl')[0]).namelist(); assert 'ifcviewx/app/index.html' in names; assert not any(name.startswith('ifcviewx/app/docs/') for name in names)"
      - name: Install and smoke-test the wheel
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install local-bridge/dist/*.whl
          .wheel-smoke/bin/python -m pip check
          .wheel-smoke/bin/ifcviewx --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: local-bridge/dist/
          retention-days: 2

  python:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: local-bridge/pyproject.toml
      - name: Install Local Studio test dependencies
        working-directory: local-bridge
        run: pip install -e ".[check,test]"
      - name: Lint Python
        if: matrix.python-version == '3.12'
        working-directory: local-bridge
        run: python -m ruff check src tests
      - name: Test Python and MCP bridge
        working-directory: local-bridge
        run: |
          python -m pytest tests -q
          python -c "from ifcviewx import server; assert server.mcp"

  python-314:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: local-bridge/pyproject.toml
      - name: Install without optional IfcOpenShell tooling
        working-directory: local-bridge
        run: pip install -e ".[test]"
      - name: Test degraded mode and MCP bridge
        working-directory: local-bridge
        run: |
          # This assertion requires the conversion capability that Python 3.14
          # deliberately omits until IfcOpenShell publishes a compatible wheel.
          python -m pytest tests/test_api.py tests/test_guard.py tests/test_llm.py tests/test_store.py -q -rs \
            -k "not unknown_model_is_a_404_not_a_crash"
          python -c "from ifcviewx import server; assert server.mcp"

  python-windows:
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: local-bridge/pyproject.toml
      - name: Install Local Studio test dependencies
        working-directory: local-bridge
        run: pip install -e ".[check,test]"
      - name: Test Windows paths, CLI and HTTP API
        working-directory: local-bridge
        run: |
          python -m ruff check src tests
          python -m pytest tests/test_cli.py tests/test_api.py tests/test_guard.py -q

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: npm ci
      - run: pip install -r docs/requirements.txt
      - run: npm run docs:build
      - run: git diff --exit-code -- docs/plugins/catalog.md
